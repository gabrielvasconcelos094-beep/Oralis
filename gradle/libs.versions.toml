[versions]
compileSdk = "36"
targetSdk = "36"
minSdk = "29"

agp = "8.13.2"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"

# On-device TTS (MediaPipe Tasks Audio: TextToSpeech + Kokoro-82M .litertlm)
mediapipeTasksAudio = "1.2.3"

coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
