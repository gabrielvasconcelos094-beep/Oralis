navigationCompose = "2.9.6"
coroutines = "1.10.2"
serializationJson = "1.9.0"
room = "2.8.4"
work = "2.11.0"
datastore = "1.1.7"
media3 = "1.8.0"
documentfile = "1.1.0"

junit = "4.13.2"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
mediapipe-tasks-audio = { group = "com.google.mediapipe", name = "tasks-audio", version.ref = "mediapipeTasksAudio" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
